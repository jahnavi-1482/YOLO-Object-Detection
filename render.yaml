services:
  - type: web
    name: yolo-object-detection
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 1 --timeout 600 --worker-class gthread app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10